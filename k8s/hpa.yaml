apiVersion: v1
kind: HorizontalPodAutoscaler
metadata:
  name: colorpalette-hpa
  namespace: colorpalette
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: colorpalette
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
